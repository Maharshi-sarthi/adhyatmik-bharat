<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आध्यात्मिक भारत | Hindu Panchang Super App</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Lora&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        /* Exact Colors from your image_9111d5.png */
        :root {
            --bg: #050200; --bg-card: #150a05; --gold: #d4940a;
            --t1: #faf0dc; --t2: #d4b896; --saffron: #e8640c;
            --good: #4ade80; --bad: #f87171;
        }
        body { font-family: 'Lora', serif; background: var(--bg); color: var(--t1); margin: 0; }
        .hdr { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; border-bottom: 1px solid #331500; }
        .shell { display: flex; padding-top: 60px; min-height: 100vh; }
        
        /* Sidebar Styles */
        .lsb { width: 220px; background: #0a0502; border-right: 1px solid #221100; padding: 20px; }
        .rsb { width: 280px; background: #0a0502; border-left: 1px solid #221100; padding: 20px; }
        .main { flex: 1; padding: 20px; max-width: 800px; margin: 0 auto; }

        /* Card Designs from Image */
        .card { background: var(--bg-card); border-radius: 20px; border: 1px solid #331500; padding: 20px; margin-bottom: 20px; }
        .hero-card { text-align: center; background: radial-gradient(circle at center, #261000, #150a05); }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .pc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .pc-item { background: #1c0f08; padding: 12px; border-radius: 12px; border: 1px solid #3d1a00; }
        
        /* Panditai Ad Button */
        .cta-box { background: linear-gradient(135deg, #4d1a00, #1c0a00); padding: 20px; border-radius: 25px; border: 1px solid var(--saffron); text-align: center; }
        .btn-call { background: var(--saffron); color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; display: inline-block; margin-top: 10px; font-weight: bold; }
        
        .val { color: var(--gold); font-family: 'DM Mono', monospace; }
        .hi { font-family: 'Tiro Devanagari Sanskrit', serif; font-size: 1.1rem; }
    </style>
</head>
<body>

<header class="hdr">
    <div class="hi" style="color:var(--gold)">🕉️ आध्यात्मिक भारत</div>
    <div id="ist-clock" class="val" style="background:#261000; padding:5px 15px; border-radius:10px;">00:00:00</div>
</header>

<div class="shell">
    <aside class="lsb">
        <div class="hi" style="color:var(--t2); font-size:0.8rem; margin-bottom:15px;">आने वाले त्योहार</div>
        <div id="fest-list"></div>
    </aside>

    <main class="main">
        <div class="card hero-card">
            <div id="greet" class="hi" style="font-size:2rem; color:var(--gold)">शुभ रात्रि</div>
            <div id="current-date" class="val">Tuesday, 12 May 2026</div>
            <div style="margin-top:15px;">
                <input type="date" id="date-picker" onchange="searchDate()" style="background:#331500; color:white; border:none; padding:8px; border-radius:8px;">
            </div>
        </div>

        <div class="grid-4" id="sun-moon-grid"></div>

        <div class="cta-box">
            <div class="hi">🙏 घर पर पूजा-पाठ करवाएं</div>
            <div style="font-size:0.8rem; color:var(--t2); margin:10px 0;">अनुभवी पंडित जी द्वारा सभी प्रकार के संस्कार और कथाएँ।</div>
            <a href="tel:+91XXXXXXXXXX" class="btn-call">📞 संपर्क करें</a>
        </div>

        <div class="hi" style="margin:20px 0 10px; color:var(--gold)">🔱 पञ्चांग — Panch Ang</div>
        <div class="pc-grid" id="panchang-grid"></div>
    </main>

    <aside class="rsb">
        <div class="card">
            <div class="hi" style="font-size:0.9rem; margin-bottom:10px;">⏰ आज का समय</div>
            <div id="auspicious-times"></div>
        </div>
        <div class="card">
            <div class="hi" style="font-size:0.9rem; color:var(--bad); margin-bottom:10px;">🌙 अशुभ काल</div>
            <div id="inauspicious-times"></div>
        </div>
    </aside>
</div>

<script>
let P_DATA = null;

// Clock Logic
function updateClock() {
    const now = new Date().toLocaleString("en-US", {timeZone: "Asia/Kolkata"});
    const time = new Date(now).toLocaleTimeString('en-GB');
    document.getElementById('ist-clock').innerText = time;
}
setInterval(updateClock, 1000);

// Load Data From your JSON files
async function loadPanchang() {
    try {
        const response = await fetch('today_panchang.json?v=' + Date.now());
        P_DATA = await response.json();
        render();
    } catch(e) {
        document.querySelector('.main').innerHTML += "<p style='color:red'>Data load nahi ho raha. GitHub Actions check karein.</p>";
    }
}

function render() {
    const d = P_DATA;
    // Hero Section
    document.getElementById('current-date').innerText = d.date.gregorian;
    
    // Sun Moon Grid
    document.getElementById('sun-moon-grid').innerHTML = `
        <div class="pc-item">🌅<br>सूर्योदय<br><span class="val">${d.sun_moon.sunrise}</span></div>
        <div class="pc-item">🌇<br>सूर्यास्त<br><span class="val">${d.sun_moon.sunset}</span></div>
        <div class="pc-item">🌙<br>चन्द्रोदय<br><span class="val">${d.sun_moon.moonrise}</span></div>
        <div class="pc-item">☀️<br>मध्याह्न<br><span class="val">${d.sun_moon.solar_noon}</span></div>
    `;

    // Panchang Grid
    const pa = d.panch_ang;
    document.getElementById('panchang-grid').innerHTML = `
        <div class="pc-item"><small>TITHI</small><br><b class="hi">${pa.tithi.name_hi}</b><br><span class="val">${pa.tithi.paksha_hi}</span></div>
        <div class="pc-item"><small>NAKSHATRA</small><br><b class="hi">${pa.nakshatra.name_hi}</b><br><span class="val">पाद ${pa.nakshatra.pada}</span></div>
        <div class="pc-item"><small>YOGA</small><br><b class="hi">${pa.yoga.name_hi}</b><br><span class="val">${pa.yoga.nature}</span></div>
        <div class="pc-item"><small>VAR</small><br><b class="hi">${d.date.weekday_hi}</b><br><span class="val">${d.date.day_deity_hi}</span></div>
    `;

    // Auspicious/Inauspicious
    document.getElementById('auspicious-times').innerHTML = `
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin:5px 0;"><span>Abhijit</span><span class="val">${d.auspicious.abhijit_muhurat}</span></div>
    `;
    document.getElementById('inauspicious-times').innerHTML = `
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin:5px 0;"><span>Rahu Kalam</span><span class="val" style="color:var(--bad)">${d.inauspicious.rahu_kalam}</span></div>
    `;
}

function searchDate() {
    const picked = document.getElementById('date-picker').value;
    alert("Universal calculation engine active: Requesting data for " + picked);
    // Note: User can now use GitHub manual trigger for specific dates as we discussed.
}

loadPanchang();
</script>
</body>
</html>
