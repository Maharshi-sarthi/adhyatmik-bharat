<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आध्यात्मिक भारत | Adhyatmik Bharat Super App</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Lora&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050200; --bg-card: #150a05; --gold: #d4940a;
            --t1: #faf0dc; --t2: #d4b896; --saffron: #e8640c;
            --good: #4ade80; --bad: #f87171;
        }
        body { font-family: 'Lora', serif; background: var(--bg); color: var(--t1); margin: 0; }
        .hdr { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; border-bottom: 1px solid #331500; }
        .shell { display: flex; padding-top: 60px; min-height: 100vh; }
        .lsb, .rsb { width: 250px; background: #0a0502; padding: 20px; }
        .main { flex: 1; padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: var(--bg-card); border-radius: 20px; border: 1px solid #331500; padding: 20px; margin-bottom: 20px; }
        .hero-card { text-align: center; background: radial-gradient(circle at center, #261000, #150a05); }
        .pc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .pc-item { background: #1c0f08; padding: 15px; border-radius: 12px; border: 1px solid #3d1a00; }
        .cta-box { background: linear-gradient(135deg, #4d1a00, #1c0a00); padding: 20px; border-radius: 20px; border: 1px solid var(--saffron); text-align: center; }
        .btn-call { background: var(--saffron); color: white; padding: 10px 25px; border-radius: 10px; text-decoration: none; display: inline-block; margin-top: 10px; font-weight: bold; }
        .val { color: var(--gold); font-family: 'DM Mono', monospace; }
        .hi { font-family: 'Tiro Devanagari Sanskrit', serif; }
    </style>
</head>
<body>

<header class="hdr">
    <div class="hi" style="color:var(--gold); font-size: 1.3rem;">🕉️ आध्यात्मिक भारत</div>
    <div id="ist-clock" class="val">00:00:00</div>
</header>

<div class="shell">
    <aside class="lsb">
        <div class="hi" style="color:var(--t2);">आने वाले त्योहार</div>
        <div id="fest-list" style="margin-top:10px; font-size:0.9rem;">लोड हो रहा है...</div>
    </aside>

    <main class="main">
        <div class="card hero-card">
            <div id="greet" class="hi" style="font-size:2rem; color:var(--gold)">शुभ रात्रि</div>
            <div id="current-date" class="val">-</div>
            <div style="margin-top:15px;">
                <input type="date" id="date-picker" onchange="updateView()" style="background:#331500; color:white; border:1px solid var(--gold); padding:8px; border-radius:8px;">
            </div>
        </div>

        <div class="cta-box">
            <div class="hi">🙏 घर पर पूजा-पाठ करवाएं</div>
            <a href="tel:+91XXXXXXXXXX" class="btn-call">📞 संपर्क करें</a>
        </div>

        <div class="hi" style="margin:20px 0 10px; color:var(--gold)">🔱 पञ्चांग — Panch Ang</div>
        <div class="pc-grid" id="panchang-grid">
            <div class="pc-item">Tithi तिथि<br><span id="tithi" class="val">-</span></div>
            <div class="pc-item">Nakshatra नक्षत्र<br><span id="nak" class="val">-</span></div>
            <div class="pc-item">Sunrise सूर्योदय<br><span id="sr" class="val">-</span></div>
            <div class="pc-item">Sunset सूर्यास्त<br><span id="ss" class="val">-</span></div>
        </div>
    </main>

    <aside class="rsb">
        <div class="card">
            <div class="hi" style="font-size:0.9rem;">⏰ आज का समय</div>
            <div id="abhijit" class="val" style="margin-top:10px;">-</div>
        </div>
    </aside>
</div>

<script>
let P_DATA = null;

// Clock
setInterval(() => {
    const now = new Date().toLocaleString("en-US", {timeZone: "Asia/Kolkata"});
    document.getElementById('ist-clock').innerText = new Date(now).toLocaleTimeString('en-GB');
}, 1000);

async function loadData() {
    try {
        // Fetch current day data
        const r = await fetch('today_panchang.json?v=' + Date.now());
        P_DATA = await r.json();
        render(P_DATA);
    } catch(e) {
        console.log("No daily file yet.");
    }
}

function render(d) {
    document.getElementById('current-date').innerText = d.date.gregorian;
    document.getElementById('tithi').innerText = d.panch_ang.tithi.name_hi;
    document.getElementById('nak').innerText = d.panch_ang.nakshatra.name_hi;
    document.getElementById('sr').innerText = d.sun_moon.sunrise;
    document.getElementById('ss').innerText = d.sun_moon.sunset;
    document.getElementById('abhijit').innerText = "Abhijit: " + d.auspicious.abhijit_muhurat;
}

// 404 Prevention: Date badalne par sirf UI badlo, page redirect mat karo
function updateView() {
    const picked = document.getElementById('date-picker').value;
    if(!picked) return;
    
    // Yahan hum user ko batayenge ki naya data calculate ho raha hai
    document.getElementById('greet').innerText = "तिथि खोजी जा रही है...";
    document.getElementById('current-date').innerText = picked;
    
    // NOTE: Real calculation engine ko yahan call karein
    console.log("Searching data for: " + picked);
}

loadData();
</script>
</body>
</html>
