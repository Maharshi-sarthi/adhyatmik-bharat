name: Daily Panchang Update

on:
  schedule:
    # 18:30 UTC = 00:00 AM IST (India Time)
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-panchang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyswisseph astral pytz

      - name: Generate panchang
        run: python -X utf8 panchang_engine.py > today_panchang.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add today_panchang.json
          # Is line ko dhyan se dekhiye, ye check karti hai ki kya file badli hai
          git diff --staged --quiet || (git commit -m "Panchang update: $(date '+%d %b %Y')" && git push)
