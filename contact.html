<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — आध्यात्मिक भारत</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1C0A00;--surface:#331500;--gold:#D4940A;--gold-bright:#F5C842;--saffron:#E8640C;--t1:#FAF0DC;--t2:#D4B896;--t3:#9A7A5A;--b1:rgba(212,148,10,0.2);--r2:18px;--r3:24px;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Lora',Georgia,serif;background:var(--bg);color:var(--t1);min-height:100vh}
.hdr{background:rgba(20,8,0,0.97);border-bottom:1px solid var(--b1);padding:14px 20px;display:flex;align-items:center;gap:12px}
.back{color:var(--gold);text-decoration:none;font-size:1.2rem}
.hdr-title{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.1rem;color:var(--gold-bright)}
.container{max-width:600px;margin:0 auto;padding:32px 18px 60px}
h1{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.6rem;color:var(--gold-bright);margin-bottom:6px;text-align:center}
.sub{font-size:0.82rem;color:var(--t3);text-align:center;margin-bottom:30px}
.card{background:rgba(55,25,5,0.8);border:1px solid var(--b1);border-radius:var(--r3);padding:24px;margin-bottom:18px}
h2{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.05rem;color:var(--gold);margin-bottom:14px}
.contact-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b1)}
.contact-item:last-child{border-bottom:none}
.c-icon{font-size:1.4rem;flex-shrink:0}
.c-label{font-size:0.72rem;color:var(--t3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.08em}
.c-val{font-size:0.9rem;color:var(--t1)}
.inp{width:100%;background:rgba(212,148,10,0.06);border:1px solid var(--b1);border-radius:var(--r2);color:var(--t1);padding:11px 14px;font-size:0.88rem;margin-bottom:12px;outline:none;font-family:'Lora',serif}
.inp:focus{border-color:var(--gold)}
textarea.inp{min-height:100px;resize:vertical}
.send-btn{width:100%;background:linear-gradient(135deg,var(--saffron),var(--gold));color:#000;border:none;padding:12px;border-radius:var(--r2);font-size:0.9rem;font-weight:700;cursor:pointer;font-family:'Lora',serif}
.back-btn{display:inline-block;background:transparent;border:1px solid var(--b1);color:var(--t2);padding:10px 24px;border-radius:30px;text-decoration:none;font-size:0.88rem;margin-top:10px}
</style>
</head>
<body>
<div class="hdr">
  <a class="back" href="index.html">←</a>
  <div class="hdr-title">Contact Us</div>
</div>
<div class="container">
  <h1>📞 संपर्क करें</h1>
  <div class="sub">हम आपकी सहायता के लिए तत्पर हैं — जय श्री राम 🙏</div>

  <div class="card">
    <h2>संपर्क जानकारी</h2>
    <div class="contact-item">
      <div class="c-icon">📧</div>
      <div><div class="c-label">Email</div><div class="c-val">adhyatmikbharat@gmail.com</div></div>
    </div>
    <div class="contact-item">
      <div class="c-icon">📺</div>
      <div><div class="c-label">YouTube</div><div class="c-val">youtube.com/@AdhyatmikBharat</div></div>
    </div>
    <div class="contact-item">
      <div class="c-icon">💬</div>
      <div><div class="c-label">Telegram</div><div class="c-val">t.me/AdhyatmikBharat</div></div>
    </div>
    <div class="contact-item">
      <div class="c-icon">🙏</div>
      <div><div class="c-label">पूजा बुकिंग</div><div class="c-val">WhatsApp पर संपर्क करें</div></div>
    </div>
  </div>

  <div class="card">
    <h2>संदेश भेजें</h2>
    <input class="inp" type="text" placeholder="आपका नाम">
    <input class="inp" type="email" placeholder="Email Address">
    <textarea class="inp" placeholder="आपका संदेश..."></textarea>
    <button class="send-btn" onclick="alert('धन्यवाद! हम जल्द संपर्क करेंगे। 🙏')">📨 संदेश भेजें</button>
  </div>

  <div style="text-align:center">
    <a class="back-btn" href="index.html">← मुख्य पृष्ठ</a>
  </div>
</div>
</body>
</html>
